<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Image Tabs</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <div class="popup-container">
    <!-- Header Section -->
    <header class="popup-header">
      <h1>Save Media Tabs</h1>
      <p class="subtitle">Bulk save images and videos</p>
    </header>

    <!-- Tab Navigation -->
    <nav class="tab-nav">
      <button id="imagesTabBtn" class="tab-btn active" data-tab="images">
        🖼️ Images <span class="tab-badge" id="imageBadge">0</span>
      </button>
      <button id="videosTabBtn" class="tab-btn" data-tab="videos">
        🎬 Videos <span class="tab-badge" id="videoBadge">0</span>
      </button>
    </nav>

    <!-- Options Section -->
    <section class="options-section">
      <div class="input-group">
        <label for="folderName">Folder Name</label>
        <input type="text" id="folderName" placeholder="YYYYMMDD_HHMMSS (default)" class="form-control">
      </div>

      <div class="checkbox-group" id="closeTabsGroup">
        <input type="checkbox" id="closeTabs" name="closeTabs" checked>
        <label for="closeTabs">Close tab after download</label>
      </div>
    </section>

    <!-- Images Section -->
    <section class="tabs-section" id="imagesSection">
      <h2>
        <span id="imagesSectionTitle">Image Tabs</span>
        <label class="select-all-group">
          <input type="checkbox" id="selectAllImages" checked>
          <span>Select All</span>
        </label>
      </h2>
      <div id="imagesList" class="tabs-list">
        <div class="loading">Loading...</div>
      </div>
    </section>

    <!-- Videos Section (hidden by default) -->
    <section class="tabs-section hidden" id="videosSection">
      <h2>
        <span>Detected Videos</span>
        <label class="select-all-group">
          <input type="checkbox" id="selectAllVideos" checked>
          <span>Select All</span>
        </label>
      </h2>
      <div id="videosList" class="tabs-list">
        <div class="loading">Loading...</div>
      </div>
      <p class="video-hint">
        Videos are detected when they play on a page. <a href="#" id="videoHelpLink">Learn more</a>
      </p>
    </section>

    <!-- Action Buttons -->
    <section class="actions-section">
      <button id="saveAllBtn" class="btn btn-primary" disabled>
        <span class="btn-icon">💾</span>
        <span id="saveButtonText">Save All</span>
      </button>

      <button id="refreshBtn" class="btn btn-secondary">
        <span class="btn-icon">🔄</span>
        Refresh
      </button>
    </section>

    <!-- Status Message -->
    <div id="statusMessage" class="status-message hidden"></div>

    <!-- Footer with Settings Link -->
    <footer class="popup-footer">
      <a href="#" id="settingsLink" class="settings-link">⚙️ Settings</a>
      <span class="version">v1.1.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>

</html>
